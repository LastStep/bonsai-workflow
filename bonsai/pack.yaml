# bonsai/pack.yaml: the workflow pack's Bonsai manifest, format bonsai.pack/1. Bonsai's engine reads it when a
# project links the pack (bonsai init, bonsai update) and when the pack's CI runs bonsai check --pack; Claude Code
# never reads it. It says who the pack is, what a machine needs, what the engine writes into a project (the
# always-on file) and what the pack declares (its six document kinds and its six roles with their
# limits). Every key carries its comment, at its line's end or on the line just above; bonsai check --pack fails a
# key without one. Every field's full meaning, type and allowed values: bonsai check --schema bonsai.pack. Text that
# does not start with a letter is quoted (format-1 YAML). README.md says how a project takes the pack.
format: bonsai.pack/1                 # the format and its version, always the first key; only bonsai.pack/1
# id: the pack's id, equal to "name" in .claude-plugin/plugin.json; its roles and skills load as workflow:<name>,
# e.g. workflow:builder, workflow:lanes; its labels are named workflow.<name>
id: workflow
# version: the pack's version, quoted, as X.Y.Z; a release tag must be "v" and this (v1.0.1). plugin.json never
# carries one: a project pins the pack by commit, and that commit is the version Claude Code sees
version: "1.0.1"
needs:                                # what a machine needs for the pack; bonsai status --json lists each
  # claude_code: the oldest Claude Code the pack works with, quoted: Bonsai's own floor, so the pack asks for no newer
  # one than Bonsai does (its roles' preloads and maxTurns were measured on 2.1.300: README.md); null: none of its own
  claude_code: "2.1.294"
# block: the pack's part of the instruction block in a project's CLAUDE.md, bonsai/block.md: four lines naming the
# roles, the lanes and the templates. It loads in every session, so its docs stay in its own leading comment
block: block.md
files:                                # the files the engine writes into a project, each from bonsai/files/
  # path: the always-on protocol, written into the project's protocols folder (documents.protocols in its
  # bonsai.yaml, work/protocols unless the project changed it), which the block imports: it loads in every session
  - path: "<protocols>/session-start.md"
    from: session-start.md            # its source, bonsai/files/session-start.md
    kind: pack                        # Bonsai's file: an edit in the project is a conflict, and update rewrites it
hooks: []                             # no hook lines: the pack carries no code that runs
deny: []                              # no walls of its own: base's walls hold, and a studio adds its own files' walls in its own pack or settings
# documents: the six document kinds the pack declares, each with its template skill (workflow:<kind>). A project keeps each kind's place in its bonsai.yaml's documents, under the kind's name.
# Moves follow contract section 10.2: a person approves (and accepts, decides, closes or cuts); agents make the rest
documents:
  - kind: plan                        # how a task will be built, for the person to approve: skill workflow:plan
    path: work/plans                  # its default folder, one file per plan, named after its id (P-T-1234.md)
    file: null                        # a folder, not one file
    id: "^P-T-[0-9]{4,6}$"            # P-T- and its task's number: one plan per task (P-T-1234 for T-1234)
    statuses: [draft, approved, rejected, superseded]   # a new plan starts at draft
    person:                           # the moves a person makes
      - [draft, approved]             # the person approves the plan
      - [draft, rejected]             # the person turns it down
    agent:                            # the moves agents make
      - [rejected, draft]             # the orchestrator writes it again after a rejection
      - [approved, superseded]        # an approved plan another one replaces
    stamp:                            # fields set to the day's date when a plan reaches a status
      approved: approved              # approved: the day the person approved it
    task_field: task                  # the field naming the task the plan is for
  - kind: feature                     # a one-pager: what a player gets, for the person to approve: skill workflow:feature
    path: work/features               # its default folder, one file per one-pager, named after its id (F-room-codes.md)
    file: null                        # a folder, not one file
    id: "^F-[a-z0-9-]+$"              # F- and a short slug: F-room-codes
    statuses: [draft, approved, building, verified, done, cut]   # a new one-pager starts at draft
    person:                           # the moves a person makes
      - [draft, approved]             # the person approves the one-pager
      - [verified, done]              # the person played it and closes it
      - [draft, cut]                  # the person cuts it, from any open status
      - [approved, cut]               # cut once approved
      - [building, cut]               # cut while it is built
      - [verified, cut]               # cut once verified
    agent:                            # the moves agents make
      - [approved, building]          # its first task starts
      - [building, verified]          # its tasks are built and verified
      - [verified, building]          # a later check found more to build
    stamp:                            # fields set to the day's date when a one-pager reaches a status
      approved: approved              # approved: the day the person approved it
    task_field: null                  # a one-pager has many tasks; each names it in its workflow.feature label
  - kind: decision                    # a decision record, so an argument is not had twice: skill workflow:decision
    path: work/decisions              # its default folder, one file per record (ADR-0123-plain-yaml.md)
    file: null                        # a folder, not one file
    id: "^ADR-[0-9]{4}$"              # ADR- and four digits, sequential, never reused
    statuses: [proposed, accepted, superseded]   # a new record starts at proposed
    person:                           # the moves a person makes
      - [proposed, accepted]          # the person accepts the record
    agent:                            # the moves agents make
      - [accepted, superseded]        # a later record replaces it; its superseded_by names that one
    stamp:                            # fields set to the day's date when a record reaches a status
      accepted: date                  # date: the day the record was accepted
    task_field: null                  # a record belongs to no one task
  - kind: options                     # an options write-up for a decision the person makes: skill workflow:options
    path: work/options                # its default folder, one file per write-up (OPT-0123-hosting.md)
    file: null                        # a folder, not one file
    id: "^OPT-[0-9]{4}$"              # OPT- and four digits, sequential
    statuses: [open, decided, deferred]   # a new write-up starts at open
    person:                           # the moves a person makes
      - [open, decided]               # the person chooses
      - [deferred, decided]           # the person chooses one that waited
    agent:                            # the moves agents make
      - [open, deferred]              # nothing is blocked by it, so it waits
      - [deferred, open]              # it is needed again
    stamp:                            # fields set to the day's date when a write-up reaches a status
      decided: decided                # decided: the day the person chose
    task_field: null                  # a write-up belongs to no one task
  - kind: spec                        # a design spec for work bigger than one feature: skill workflow:spec
    path: work/specs                  # its default folder, one file per spec, named after its id
    file: null                        # a folder, not one file
    id: "^SPEC-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$"   # SPEC-, the day it was started, a slug: SPEC-2026-10-15-sync
    statuses: [draft, approved]       # a new spec starts at draft
    person:                           # the moves a person makes
      - [draft, approved]             # the person approves the spec
    agent: []                         # agents make no move of a spec's status
    stamp:                            # fields set to the day's date when a spec reaches a status
      approved: approved              # approved: the day the person approved it
    task_field: null                  # a spec belongs to no one task
  - kind: bugs                        # the project's register of known bugs, one file: skill workflow:bugs
    path: null                        # one file, not a folder
    file: work/bugs.md                # its default file
    id: null                          # the file holds no id of its own; each bug's id is a row in it
    statuses: []                      # no statuses
    person: []                        # no moves
    agent: []                         # no moves
    stamp: {}                         # no dates set by a move
    task_field: null                  # the register belongs to no one task
protected: []                         # no protected paths of the pack's own; bonsai.yaml names the project's
# roles: the six roles, each with its file agents/<name>.md (loaded as workflow:<name>) and its limits. Each limit
# has a default (what an agent of the role gets when its brief names none) and a max (the most a brief may give it),
# each a whole number or null for no limit; the pack ships the max equal to the default, and a project sets its own
# under the pack's entry in its bonsai.yaml. max_turns equals the role file's maxTurns (bonsai check --pack holds the
# two equal): Claude Code's own stop where Bonsai's guard does not run, four times the default actions
roles:
  - name: orchestrator                # the session the person talks to; its file agents/orchestrator.md
    kind: lead                        # it calls builders, verifiers and helpers
    session: true                     # the person's own session plays it: never a subagent, and no budget
    writes: true                      # it writes plans, tasks and records
    max_turns: null                   # no maxTurns: the person's session is never cut
    minutes:                          # minutes since its first call; the person's session has no limit
      default: null                   # no limit
      max: null                       # no limit
    actions:                          # tool calls; the person's session has no limit
      default: null                   # no limit
      max: null                       # no limit
    red_runs:                         # failed ladder runs in a row; the person's session has no limit
      default: null                   # no limit
      max: null                       # no limit
  - name: builder                     # builds one task in its own worktree; its file agents/builder.md
    kind: lead                        # it may call helpers
    session: false                    # an agent the orchestrator starts
    writes: true                      # it changes its task's files
    max_turns: 2400                   # four times its default actions
    minutes:                          # minutes since its first call, or since it read its newest brief
      default: 180                    # three hours unless its brief names another
      max: 180                        # the most a brief may give, as shipped
    actions:                          # tool calls, refused ones counted, from the same start
      default: 600                    # six hundred calls unless its brief names another
      max: 600                        # the most a brief may give, as shipped
    red_runs:                         # failed ladder runs in a row; a green run sets the count back to 0
      default: 4                      # four red climbs in a row stop it
      max: 4                          # the most a brief may give, as shipped
  - name: verifier                    # checks work through one lens, in a fresh context; its file agents/verifier.md
    kind: lead                        # it may call helpers
    session: false                    # an agent the orchestrator starts
    writes: false                     # it changes nothing: Bonsai's guard refuses it every file edit
    max_turns: 1600                   # four times its default actions
    minutes:                          # minutes since its first call, or since it read its newest brief
      default: 120                    # two hours unless its brief names another
      max: 120                        # the most a brief may give, as shipped
    actions:                          # tool calls, refused ones counted, from the same start
      default: 400                    # four hundred calls unless its brief names another
      max: 400                        # the most a brief may give, as shipped
    red_runs:                         # failed ladder runs in a row: a verifier's red climb is a finding, not a stop
      default: null                   # no limit
      max: null                       # no limit
  - name: researcher                  # one question from the web; its file agents/researcher.md
    kind: helper                      # it calls no one
    session: false                    # an agent a lead starts
    writes: false                     # it changes nothing
    max_turns: 600                    # four times its default actions
    minutes:                          # minutes since its first call, or since it read its newest brief
      default: 30                     # thirty minutes unless its brief names another
      max: 30                         # the most a brief may give, as shipped
    actions:                          # tool calls, refused ones counted, from the same start
      default: 150                    # one hundred and fifty calls unless its brief names another
      max: 150                        # the most a brief may give, as shipped
    red_runs:                         # failed ladder runs in a row: it climbs no ladder
      default: null                   # no limit
      max: null                       # no limit
  - name: auditor                     # one scoped question about the project; its file agents/auditor.md
    kind: helper                      # it calls no one
    session: false                    # an agent a lead starts
    writes: false                     # it changes nothing
    max_turns: 600                    # four times its default actions
    minutes:                          # minutes since its first call, or since it read its newest brief
      default: 30                     # thirty minutes unless its brief names another
      max: 30                         # the most a brief may give, as shipped
    actions:                          # tool calls, refused ones counted, from the same start
      default: 150                    # one hundred and fifty calls unless its brief names another
      max: 150                        # the most a brief may give, as shipped
    red_runs:                         # failed ladder runs in a row: it climbs no ladder
      default: null                   # no limit
      max: null                       # no limit
  - name: runner                      # runs what its brief names and returns counts; its file agents/runner.md
    kind: helper                      # it calls no one
    session: false                    # an agent a lead starts
    writes: false                     # it changes nothing in the project: its builds and logs go to a scratch folder
    max_turns: 1000                   # four times its default actions
    minutes:                          # minutes since its first call, or since it read its newest brief
      default: 150                    # two and a half hours unless its brief names another
      max: 150                        # the most a brief may give, as shipped
    actions:                          # tool calls, refused ones counted, from the same start
      default: 250                    # two hundred and fifty calls unless its brief names another
      max: 250                        # the most a brief may give, as shipped
    red_runs:                         # failed ladder runs in a row: a red climb it runs is a count it reports
      default: null                   # no limit
      max: null                       # no limit
